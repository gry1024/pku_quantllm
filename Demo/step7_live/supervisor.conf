; Step 7: supervisor 配置（Linux / WSL 用）
;
; 安装：
;   sudo apt-get install supervisor
;   sudo cp supervisor.conf /etc/supervisor/conf.d/quantllm.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; 操作：
;   supervisorctl status quantllm          # 看是否 RUNNING
;   supervisorctl restart quantllm         # 重启
;   supervisorctl tail -f quantllm         # 实时跟日志（stdout/stderr）
;
; ⚠️ 把 user / paths 改成你自己的
; ⚠️ stdout_logfile / stderr_logfile 目录要 supervisor 进程能写

[program:quantllm]
command=/home/groy/miniconda3/envs/quantllm/bin/python /home/groy/quantllm/Demo/step7_live/run.py
user=groy
autostart=true
autorestart=true
startretries=10
startsecs=10
stopwaitsecs=30
stopsignal=TERM
; 优先级：越高越先启动（同一 supervisor 下多个 program 排序用）
priority=999

; stdout / stderr —— supervisor 自带的 stdout/stderr 转发
stdout_logfile=/home/groy/quantllm/Demo/step7_live/logs/supervisor.out
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/home/groy/quantllm/Demo/step7_live/logs/supervisor.err
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 环境变量（如果你的策略需要）
environment=PYTHONUNBUFFERED="1",TZ="Asia/Shanghai"